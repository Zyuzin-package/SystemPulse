services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: systempulse
      POSTGRES_USER: systempulse
      POSTGRES_PASSWORD: systempulse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U systempulse -d systempulse"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"

  system-pulse-core:
    build:
      context: .
      dockerfile: system-pulse-core/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/systempulse
      SPRING_DATASOURCE_USERNAME: systempulse
      SPRING_DATASOURCE_PASSWORD: systempulse
      JAVA_TOOL_OPTIONS: >-
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "5005:5005"

  target-service:
    build:
      context: .
      dockerfile: target-service/Dockerfile
    environment:
      SYSTEM_PULSE_URL: http://system-pulse-core:8080
      SYSTEM_PULSE_SERVICE_NAME: target-service
      SYSTEM_PULSE_ENVIRONMENT: docker
      SYSTEM_PULSE_VERSION: 1.0-SNAPSHOT
    depends_on:
      system-pulse-core:
        condition: service_started
    ports:
      - "8081:8080"

volumes:
  postgres-data:
